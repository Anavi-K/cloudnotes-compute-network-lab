# Local stand-in for GCP firewall rules attached to the CloudNotes VPC.
# Fields mirror real GCP firewall rule fields: name, direction, allowed
# (protocol + ports), source_ranges.

rules:
  - name: allow-http-https
    direction: INGRESS
    allowed:
      - protocol: tcp
        ports: ["80", "443"]
    source_ranges: ["0.0.0.0/0"]

  - name: allow-ssh
    direction: INGRESS
    allowed:
      - protocol: tcp
        ports: ["22"]
    source_ranges: ["0.0.0.0/0"]

  - name: allow-db-internal
    direction: INGRESS
    allowed:
      - protocol: tcp
        ports: ["5432"]
    source_ranges: ["10.0.0.0/8"]
